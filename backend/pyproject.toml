[project]
name = "appgro-backend"
version = "0.1.0"
description = "AppGro agricultural API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.24",
    "sqlmodel>=0.0.38",
    "psycopg2-binary>=2.9",
    "alembic>=1.18",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
